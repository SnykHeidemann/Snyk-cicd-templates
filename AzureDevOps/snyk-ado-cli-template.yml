# snyk-ado-cli-template.yml
parameters:
  - name: SNYK_TOKEN
    type: string
    default: '' # Best to leave empty and pass a secret variable from the main pipeline
  - name: SNYK_FLAGS_TEST
    type: string
    default: '--all-projects'
  - name: SNYK_FLAGS_CODETEST
    type: string
    default: '--severity-threshold=high'

steps:
- script: |
    npm install -g snyk
    snyk auth ${{ parameters.SNYK_TOKEN }}
  displayName: 'npm install snyk and authenticate'

- script: |
    snyk test ${{ parameters.SNYK_FLAGS_TEST }}
  displayName: 'snyk open source test'
  continueOnError: true

- script: |
    snyk code test ${{ parameters.SNYK_FLAGS_CODETEST }}
  displayName: 'snyk code test'
  continueOnError: true
